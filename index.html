<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="ArgDaily" />
<link rel="apple-touch-icon" href="https://small-waterfall-6097.fedetrade.workers.dev/apple-touch-icon.png" />
<link rel="icon" type="image/png" href="https://small-waterfall-6097.fedetrade.workers.dev/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>
  /* ===== MOBILE FIRST: base para celular, ajustes para pantallas más grandes al final ===== */
  :root{
    --bg:#0d0f12; --panel:#15181d; --panel2:#1b1f26; --line:#262b33;
    --ink:#e9e6df; --muted:#8d939c; --accent:#6cb4ee; --sun:#f2c14e;
    --up:#3ecf8e; --down:#ff5c5c;
    --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4;overscroll-behavior-y:contain}
  a{color:inherit;text-decoration:none}
  .wrap{padding:0 calc(14px + var(--safe-r)) calc(24px + env(safe-area-inset-bottom,0px)) calc(14px + var(--safe-l))}
  .scroll-x{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -14px;padding:0 14px}
  .scroll-x::-webkit-scrollbar{display:none}
  .scroll-x > *{flex:none;scroll-snap-align:start}

  /* tira fija */
  .ticker{position:sticky;top:0;z-index:50;background:#0a0c0e;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;padding-top:env(safe-area-inset-top,0px)}
  .ticker-track{display:inline-flex;gap:22px;padding:7px 0;animation:scroll 60s linear infinite;font-family:"JetBrains Mono",monospace;font-size:12px}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tk b{color:var(--muted);font-weight:500;margin-right:5px}

  /* encabezado */
  header.mast{padding:14px 0 10px;border-bottom:3px double var(--line)}
  .mast-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .brand{font-family:Fraunces,serif;font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1}
  .brand span{color:var(--accent)} .brand i{color:var(--sun);font-style:normal}
  .meta{color:var(--muted);font-size:11.5px;text-align:right;line-height:1.35}
  .mast-sub{margin-top:10px;display:flex;flex-direction:column;gap:8px}

  /* clima: fila deslizable */
  .clima .t{font-family:"JetBrains Mono",monospace;font-size:17px}
  .clima .d{color:var(--muted);font-size:11px;margin-top:1px}
  .dia{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center;font-size:12px;min-width:86px}
  .dia b{display:block;color:var(--muted);font-weight:500;font-size:11.5px}

  /* feriados: compacto */
  .feriados{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px}
  .feriados .d{color:var(--muted)}
  .fer-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:2px 0}
  .fer-dia{font-family:"JetBrains Mono",monospace;color:var(--sun);text-transform:capitalize}
  .fer-amb{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:auto}
  .fer-amb.solo{color:var(--accent);border-color:#2f4d66}

  /* títulos de sección */
  .section-title{font-family:Fraunces,serif;font-size:18px;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line)}

  /* tarjetas: de a 2 */
  .grid{display:grid;gap:8px}
  .g-dolar,.g-mkt{grid-template-columns:1fr 1fr}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
  .card .lbl{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  .card .val{font-family:"JetBrains Mono",monospace;font-size:18px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .card.hl{border-color:#3a4a5c;background:linear-gradient(160deg,#18202b,#15181d)}
  .card.full{grid-column:1 / -1}
  .up{color:var(--up)} .down{color:var(--down)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mini-list .item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-family:"JetBrains Mono",monospace;font-size:12.5px}
  .mini-list .item:last-child{border:0}
  svg.spark{display:none}

  /* resumen IA */
  .brief{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sun);border-radius:12px;padding:12px 14px;line-height:1.55;white-space:pre-wrap;font-size:14px}

  /* lo más importante */
  .lead{display:flex;flex-direction:column;gap:8px}
  .hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:block}
  .hero img{width:100%;height:190px;object-fit:cover;background:#222;display:block}
  .hero .body{padding:12px 14px}
  .hero h2{font-family:Fraunces,serif;font-size:21px;line-height:1.2;margin:6px 0}
  .hero p{display:none}
  .side-list{display:flex;flex-direction:column;gap:8px}
  .s-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px}
  .s-item h3{font-size:14.5px;margin:4px 0 0;line-height:1.35;font-weight:600}

  /* pestañas: una sola fila deslizable + buscador a todo el ancho */
  .toolbar{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
  .tab{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13px;white-space:nowrap;min-height:40px}
  .tab.on{background:var(--ink);color:#111;border-color:var(--ink)}
  .search{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 12px;font:inherit;font-size:16px}

  /* noticias en lista: foto chica al costado */
  .news{display:flex;flex-direction:column;gap:8px}
  .n{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;align-items:stretch;min-height:88px}
  .n img{width:92px;min-height:88px;object-fit:cover;background:#222;flex:none}
  .n .body{padding:9px 11px;display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
  .n h3{margin:0;font-size:14.5px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .n p{display:none}
  .src{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .src .s{color:var(--accent);font-weight:600}
  .badge{font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
  .empty,.err{color:var(--muted);padding:22px;text-align:center;border:1px dashed var(--line);border-radius:12px}
  .err{color:#ffb3b3;border-color:#5c2a2a}
  .skel{background:linear-gradient(90deg,#171a1f,#1f232a,#171a1f);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px;height:90px}
  @keyframes sh{to{background-position:-200% 0}}

  /* deportes */
  /* Deportes: tarjetas en fila que se deslizan de costado (se ve un pedacito de la siguiente) */
  .banda{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:12px}
  .banda > div + div{border-left:1px solid var(--line);padding-left:18px}
  .banda-bar{position:relative;height:8px;border-radius:4px;margin-top:12px;background:linear-gradient(90deg,var(--up),#d9c35a 60%,var(--down))}
  .banda-pos{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:var(--ink);transform:translateX(-50%);box-shadow:0 0 0 2px var(--bg,#0b0d10)}
  .banda-lim{font-size:11.5px;color:var(--muted);margin-top:4px}
  .banda-sen{margin:6px 0 0;padding-left:0;list-style:none;font-size:12.5px;line-height:1.5;color:var(--ink)}
  @media(max-width:900px){.banda{grid-template-columns:1fr}.banda > div + div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}}
  .banda-pd{grid-column:1/-1;border-left:0!important;padding-left:0!important;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .banda-pd + div{border-left:0!important;padding-left:0!important}
  @media(max-width:900px){.banda-pd{border-bottom:0;padding-bottom:0}}
  .banda-venc{grid-column:1/-1;border-left:0!important;padding-left:0!important;border-top:1px solid var(--line);padding-top:12px}
  .banda-venc-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px;font-size:13px}
  .banda-venc-item{background:var(--panel2);border-radius:8px;padding:8px 10px;line-height:1.5}
  .mapa{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  .mapa-box{background:var(--panel2);border-radius:8px;padding:10px 12px}
  .mapa-t{font-size:12px;color:var(--muted)}
  .mapa-v{font-family:"JetBrains Mono",monospace;font-size:18px;font-weight:600;margin-top:2px}
  .mapa-s{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
  .mapa-pie{grid-column:1/-1;display:grid;grid-template-columns:1fr 2fr;gap:18px;border-top:1px solid var(--line);padding-top:10px}
  @media(max-width:900px){.mapa{grid-template-columns:1fr}.mapa-pie{grid-template-columns:1fr}}
  @media(max-width:480px){.mapa-v{font-size:15px}.mapa-box{padding:9px 10px}}
  .rcausas{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:12px}
  .rcausas > div + div{border-left:1px solid var(--line);padding-left:18px}
  .rcausas.rc3{grid-template-columns:.8fr 1.3fr 1.1fr}
  @media(max-width:1100px){.rcausas.rc3{grid-template-columns:1fr 1fr}.rcausas.rc3 > div:last-child{grid-column:1 / -1;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}}
  .rc-notas{font-size:12px;color:var(--muted);margin-top:6px}
  .rc-grupo{margin-top:10px}
  .rc-tend{font-size:11px;font-weight:700;margin-top:3px}
  .rc-tend span{font-weight:400;color:var(--muted)}
  .rc-tsum{font-size:13px;margin-top:8px;font-weight:600}
  .rc-tlec{font-size:12.5px;margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--panel2);line-height:1.4}
  .rc-gt{font-size:11px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;color:var(--accent)}
  .rc-fondo .rc-gt{color:var(--muted)}
  .rc-fondo .rc-datos{opacity:.85}
  .rc-datos{margin-top:6px;font-size:13px;line-height:1.5}
  .rc-datos > div{padding:3px 0;border-bottom:1px dashed var(--line)}
  .rc-datos > div:last-child{border-bottom:0}
  .rc-datos b{color:var(--muted);font-weight:600}
  .rc-notas a{color:var(--accent);text-decoration:none;display:block;margin-top:3px;line-height:1.35}
  .rc-est{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  .rc-est > div{background:var(--panel2);border-radius:8px;padding:8px 10px}
  @media(max-width:900px){.rcausas,.rcausas.rc3{grid-template-columns:1fr}.rcausas > div + div{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px}}
  @media(max-width:480px){.rc-est{grid-template-columns:1fr 1fr 1fr;gap:6px}.rc-est .mapa-v{font-size:14px}.rc-est .mapa-t{font-size:11px}}
  .dep-grid{display:grid;grid-auto-flow:column;grid-auto-columns:84%;gap:8px;align-items:start;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -14px;padding:0 14px}
  .dep-grid::-webkit-scrollbar{display:none}
  .dep-grid > *{scroll-snap-align:start}
  .dep-grid > *:only-child{grid-column:1/-1}
  .dep-row{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .dep-row:last-child{border:0}
  .dep-when{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:11.5px}
  .dep-tor{color:var(--muted);font-size:11.5px}
  .live{color:var(--down);font-weight:600;font-size:11.5px}
  .dep-final{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#1a1300;background:var(--sun,#f2c14e);border-radius:4px;padding:1px 6px;margin-bottom:3px}
  .dep-more{margin-top:6px;width:100%;background:transparent;border:1px dashed var(--line);color:var(--accent);border-radius:10px;padding:10px;font:inherit;font-size:13px;min-height:42px}

  /* volver arriba */
  .arriba{position:fixed;right:calc(14px + var(--safe-r));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:18px;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  footer{color:var(--muted);font-size:11px;padding:26px 0 10px;text-align:center;line-height:1.5}


  /* aviso: abrir desde el celular */
  .bloqueo{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center}
  .bloqueo-box{max-width:460px}
  .bloqueo h2{font-family:Fraunces,serif;font-size:26px;margin:6px 0 10px}
  .bloqueo p{color:var(--muted);line-height:1.5;margin:8px 0}
  .bloqueo-url{font-family:"JetBrains Mono",monospace;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0 16px;color:var(--sun);font-size:15px;word-break:break-all}
  .bloqueo-btn{display:inline-block;margin-top:18px;background:var(--accent);color:#0d0f12;font-weight:700;border-radius:10px;padding:12px 18px}

  /* ===== tablets y pantallas más grandes ===== */
  @media (min-width:700px){
    .wrap{max-width:900px;margin:0 auto}
    .brand{font-size:34px}
    .g-dolar,.g-mkt{grid-template-columns:repeat(4,1fr)}
    .lead{display:grid;grid-template-columns:1fr 1fr}
    .news{display:grid;grid-template-columns:1fr 1fr}
    .dep-grid{grid-auto-columns:calc(50% - 4px)}
    .mast-sub{flex-direction:row;justify-content:space-between;align-items:flex-start}
  }
</style>
</head>
